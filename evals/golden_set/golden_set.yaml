    What happens to the points portion, and does the return affect their tier status?
  expected_answer: The points portion is refunded back to the member's account (within 24 hours under
    the current Loyalty Program Rules), the discount is applied proportionally across the points/cash
    split before that refund is calculated, and the return does not affect tier status since no new spend
    occurred to reverse -- this is the exact worked example in Loyalty Program Rules v2.0 Section 4, which
    Returns Policy v3.0 Section 3.3 defers to.
